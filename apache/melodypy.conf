NameVirtualHost *:80

<VirtualHost *:80>
        ServerName melodypy.com
        ServerAlias www.melodypy.com
        WSGIScriptAlias / /var/www/melody.py/melodypy.wsgi
        <Directory /var/www/melody.py/>
                Order allow,deny
                Allow from all
        </Directory>
        ErrorLog ${APACHE_LOG_DIR}/error.log
        LogLevel info
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>